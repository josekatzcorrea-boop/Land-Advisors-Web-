<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600&display=block" rel="stylesheet">

  <style>

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {

      width: 1080px;

      height: 1920px;

      overflow: hidden;

      font-family: "Montserrat", system-ui, sans-serif;

      background: #052C4D;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      color: #fff;

      padding: 80px;

      text-align: center;

    }

    /* Mismo asset y estilo que carruseles (slide--cta-minimal) */

    .isotipo {

      width: 200px;

      height: 200px;

      object-fit: contain;

      margin-bottom: 48px;

      background: transparent;

    }

    .cta {

      font-weight: 600;

      font-size: 36px;

      line-height: 1.35;

      margin-bottom: 24px;

      max-width: 820px;

    }

    .url {

      font-weight: 500;

      font-size: 32px;

      color: #A8C5D0;

      letter-spacing: 0.02em;

    }

    .descriptor {

      margin-top: 48px;

      font-weight: 300;

      font-size: 22px;

      letter-spacing: 0.32em;

      text-transform: uppercase;

      color: #A7ADB3;

    }

  </style>

</head>

<body>

  <img class="isotipo" src="/brochure/assets/isotipo-3d-blanco-transparente.png" alt="Land Advisors">

  <p class="cta">Agenda tu reunión estratégica</p>

  <p class="url">landadvisors.cl</p>

  <p class="descriptor">Estrategia inmobiliaria</p>

</body>

</html>
