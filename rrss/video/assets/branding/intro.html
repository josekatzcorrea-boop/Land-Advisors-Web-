<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500&display=block" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: "Montserrat", system-ui, sans-serif;
      background: linear-gradient(180deg, #FFFFFF 0%, #F4F7F8 55%, #EEF3F5 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #052C4D;
    }
    .isotipo {
      width: 280px;
      height: auto;
      margin-bottom: 40px;
      background: transparent;
      object-fit: contain;
    }
    .descriptor {
      font-weight: 300;
      font-size: 26px;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: #A7ADB3;
    }
  </style>
</head>
<body>
  <img class="isotipo" src="/assets/logo-isotipo-3d-transparente.png" alt="Land Advisors">
  <p class="descriptor">Estrategia inmobiliaria</p>
</body>
</html>
