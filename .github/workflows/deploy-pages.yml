name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site (landing/ as root)
        run: |
          node landing/scripts/build-seo.mjs
          mkdir -p _site/assets
          rsync -a \
            --exclude 'Imágenes/' \
            --exclude 'Imagenes/' \
            --exclude 'video/' \
            --exclude 'kmz-extract/' \
            --exclude 'seo/' \
            --exclude 'scripts/' \
            --exclude '*.ps1' \
            --exclude '*.md' \
            --exclude 'filelist.txt' \
            --exclude 'maps-config.example.js' \
            landing/ _site/
          cp assets/logo-horizontal-3d.jpg _site/assets/
          cp assets/logo-isotipo-3d.png _site/assets/
          cp assets/logo-isotipo-3d-transparente.png _site/assets/
          cp assets/logo-grande-3d-transparente.png _site/assets/ 2>/dev/null || cp "assets/LOGO GRANDE JPG-02-3D.jpg" _site/assets/logo-grande-3d-transparente.jpg
          cp "assets/LOGO GRANDE JPG-02-3D.jpg" _site/assets/
          rsync -a \
            --exclude 'corporativo/official/' \
            --exclude 'corporativo/Land-Advisors-Corporativo.pdf' \
            --exclude 'visual/' \
            --exclude 'triptico/' \
            --exclude '*.ps1' \
            --exclude '*.pdf' \
            --exclude 'contenido brochure.txt' \
            --exclude 'README.md' \
            brochure/ _site/brochure/
          echo 'www.landadvisors.cl' > _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
